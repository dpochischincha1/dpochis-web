backend:
  name: git-gateway
  branch: main
media_folder: "public/images/uploads"
public_folder: "/images/uploads"
collections:
    - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    fields:
            - {label: "Nombre", name: "title", widget: "string"}
            - {label: "Precio S/", name: "precio", widget: "number"}
            - {label: "Descripción", name: "body", widget: "text"}
            - {label: "Foto", name: "image", widget: "image"}
