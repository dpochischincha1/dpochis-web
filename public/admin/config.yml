backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
    - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "Título", name: "title", widget: "string"}
            - {label: "Precio", name: "precio", widget: "number"}
            - {label: "Descripción", name: "descripcion", widget: "text"}
            - {label: "Imagen", name: "imagen", widget: "image"}
            - {label: "Categoría", name: "categoria", widget: "select", options: ["Hamburguesas", "Salchipapas", "Bebidas", "Combos"]}
            - {label: "Publicado", name: "draft", widget: "boolean", default: false}
